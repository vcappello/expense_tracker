# Deploy automatico su GitHub Pages.
# A ogni push su `main` builda l'app in produzione (base path = sottocartella del
# repo) e pubblica `dist/` sulla branch `gh-pages`.
# Richiede in Impostazioni del repo → Pages: Source = "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # Base path della sottocartella del repo: gli asset (e manifest/SW)
          # puntano a /expense_tracker/... perché il sito è servito da
          # https://vcappello.github.io/expense_tracker/
          BASE_URL: /expense_tracker/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
